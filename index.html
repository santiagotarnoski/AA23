<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AA23 - Autenticación y sesiones</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">
        <!-- HEADER PÚBLICO CON NAVEGACIÓN POR PESTAÑAS -->
        <header id="main-header">
            <h1>AA23 · Autenticación de usuarios</h1>
            <p id="estado-sesion" role="status" aria-live="polite">Comprobando sesión…</p>
            <nav id="nav-publico" class="nav-tabs oculto" aria-label="Acceso de usuarios">
                <button id="tab-login" class="btn-tab active">Iniciar Sesión</button>
                <button id="tab-registro" class="btn-tab">Registrar Cuenta</button>
            </nav>
        </header>

        <!-- SECCIÓN 1: VISTA DE LOGIN -->
        <section id="vista-login" class="card-view oculto">
            <h2>Ingreso al Sistema</h2>
            <div id="msg-login" class="mensaje-box" role="status" aria-live="polite"></div>

            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico:</label>
                    <input type="email" id="login-email" name="email" placeholder="ejemplo@ucp.edu.ar" maxlength="100" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="login-pass">Contraseña:</label>
                    <input type="password" id="login-pass" name="password" placeholder="••••••••" maxlength="72" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </section>

        <!-- SECCIÓN 2: VISTA DE REGISTRO DE USUARIOS -->
        <section id="vista-registro" class="card-view oculto">
            <h2>Alta de Nuevo Usuario</h2>
            <div id="msg-registro" class="mensaje-box" role="status" aria-live="polite"></div>
            <button id="btn-volver-panel" type="button" class="btn-secondary oculto">Volver al panel</button>

            <form id="form-registro">
                <div class="form-group">
                    <label for="reg-nombre">Nombre Completo:</label>
                    <input type="text" id="reg-nombre" name="nombre" placeholder="Juan Pérez" maxlength="100" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="reg-email">Correo Electrónico:</label>
                    <input type="email" id="reg-email" name="email" placeholder="juan@ucp.edu.ar" maxlength="100" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="reg-pass">Contraseña:</label>
                    <input type="password" id="reg-pass" name="password" placeholder="Mínimo 8 caracteres" minlength="8" maxlength="72" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn-success">Guardar Usuario</button>
            </form>
        </section>

        <!-- SECCIÓN 3: VISTA PRIVADA / PANEL PROTEGIDO -->
        <section id="vista-panel" class="card-view oculto">
            <div class="panel-header">
                <h2>Panel de Control Protegido</h2>
                <button id="btn-logout" class="btn-danger">Cerrar Sesión</button>
            </div>

            <div class="user-card">
                <h3>Bienvenido/a, <span id="user-nombre" class="highlight"></span></h3>
                <p><strong>Correo Electrónico:</strong> <span id="user-email"></span></p>
                <p><strong>Rol Asignado:</strong> <span id="user-rol" class="badge"></span></p>
                <p><strong>Estado de Sesión:</strong> <span class="status-online">● Activa</span></p>
            </div>

            <hr class="divider">

            <!-- Acceso directo para registrar nuevos usuarios desde el panel -->
            <div class="admin-actions">
                <h3>Gestión de Usuarios</h3>
                <p>Podés registrar otra cuenta y conservar tu sesión actual.</p>
                <button id="btn-abrir-registro-panel" class="btn-secondary">+ Registrar Nuevo Usuario</button>
            </div>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
